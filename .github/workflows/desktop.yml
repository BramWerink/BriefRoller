name: Desktop app

on:
  # Run by hand: Actions → Desktop app → Run workflow.
  workflow_dispatch:
  # A version tag (e.g. v0.2.0) also publishes a GitHub Release with the installer.
  push:
    tags: ['v*']
  # Prove the desktop build still compiles when its files change.
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/platform/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installer
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: brief-roller-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          src-tauri/target/release/bundle/nsis/*.exe
          --title "Brief Roller $GITHUB_REF_NAME"
          --generate-notes
